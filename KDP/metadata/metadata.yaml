# KDP description field (<= 4000 chars, limited HTML allowed). The paste-ready
# HTML version is KDP/metadata/description.html. Plain-text summary:
description: >
  Building Embodied AI is a practitioner's guide to agents that perceive, reason, and act in
  the physical world, across 60 chapters in twelve parts: foundations of embodied AI, the
  mathematics of robotics and control, the modern simulation and tooling stack, reinforcement
  learning for control, learning from demonstration and robot data, embodied perception,
  language-vision-and-action, world models and model-based control, manipulation and
  locomotion, multi-agent and human-centered embodiment, evaluation-safety-and-deployment, and
  frontiers with capstones and course design. Every core idea is built from scratch and then
  shown with the modern library that makes it a few lines of code. It covers coordinate frames
  and rigid-body transforms, kinematics and dynamics, state estimation and sensor fusion,
  MuJoCo, MJX, Isaac Lab and Genesis, sim-to-real transfer, policy gradients and PPO, reward
  design, imitation learning, action chunking and diffusion policies, SLAM and mapping,
  vision-language models and vision-language-action (VLA) models, robot foundation models and
  cross-embodiment learning, generative and video world models, robotic manipulation and
  whole-body humanoid control, human-robot interaction, evaluation and safety cases,
  robustness, and deployment. With 600+ figures, diagrams and illustrations, runnable code,
  hands-on labs, and exercises, it takes you from your first coordinate transform to
  vision-language-action policies and model-based agents, told as one connected story in which
  the perception-action loop is refined part by part.

